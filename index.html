<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slop Harare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%238a63c9%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="title">Slop Harare <span>· Sunshine City</span></div>
    <div class="modes">
      <button data-mode="fly" class="active">1 · Fly</button>
      <button data-mode="walk">2 · Walk</button>
      <button data-mode="drive">3 · Kombi</button>
    </div>
    <label class="time">
      <span id="clock">16:30</span>
      <input id="time" type="range" min="0" max="24" step="0.05" value="16.5" />
    </label>
    <div id="where"></div>
  </div>

  <div id="help"></div>

  <div id="loading">
    <div>Slop Harare</div>
    <small id="loading-status">loading…</small>
  </div>

  <div id="credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
